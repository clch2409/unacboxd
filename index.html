<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unacboxd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --navy-dark: #111844;
      --navy-light: #4B5694;
      --navy-lighter: #7288AE;
      --beige: #EAE0CF;
      --purple: #1B2CC1;
      --orange: #DF301C;
      --xs-spacing: 4px;
      --s-spacing: 8px;
      --m-spacing: 16px;
      --l-spacing: 20px;
      --xl-spacing: 24px;
      --xxl-spacing: 40px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 62.5%;
      font-family: "Arimo", sans-serif;
      color: var(--beige)
    }

    body {
      background-color: var(--navy-light);
    }

    p {
      font-size: 1.6rem;
      text-align: center;
      font-weight: 900;
      margin-top: var(--m-spacing);
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      background-color: var(--navy-dark);
      /* box-shadow: 4px 0px 30px 8px var(--navy-dark); */
    }

    nav img {
      width: 45px;
      border-radius: 50%;
    }

    .form-busqueda {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-radio {
      display: flex;
      justify-content: center;
      flex-direction: column;
      gap: var(--xs-spacing);
      margin-bottom: var(--m-spacing);
      margin-top: var(--m-spacing);
      /* margin: var(--m-spacing) 0; */
    }

    .form-radio input[type="radio"] {
      appearance: none;
    }

    .form-radio label {
      font-size: 1.2rem;
      font-weight: 900;
      text-align: center;
      background-color: var(--navy-dark);
      padding: var(--s-spacing) var(--m-spacing);
      transition: background-color 0.2s ease-in;
      border-radius: 10px;

    }

    /* Pseudoclase -> El estado del elemento */
    .form-radio label:hover {
      background-color: var(--navy-lighter);
      cursor: pointer;
      color: var(--navy-dark);
    }

    input[type="radio"]:checked+label {
      background-color: var(--navy-lighter);
      cursor: pointer;
      color: var(--navy-dark);
    }

    .container-filter-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--m-spacing);
    }

    input[type="text"] {
      padding: var(--s-spacing);
      border-radius: var(--s-spacing);
      border: none;
      width: 300px;
      outline: none;
      font-family: inherit;
      font-size: 1.2rem;
      transition: box-shadow 0.2s ease;
    }

    input[type="text"]:focus {
      box-shadow: 0px 0px 15px 2px var(--beige);
    }

    .form-container-filter {
      display: flex;
      position: relative;
      max-width: fit-content;
    }

    .form-container-filter:hover .filter-options {
      display: block;
      min-width: fit-content;
    }

    .form-container-filter:hover .filter-options ul {
      display: flex;
      flex-direction: column;
      gap: var(--s-spacing);
      padding: var(--s-spacing);
      color: var(--beige);
    }

    .filter-options ul li {
      border-radius: var(--xs-spacing);
      padding: var(--s-spacing);
      user-select: none;
    }

    .filter-options ul li:hover {
      background-color: var(--navy-light);
      color: var(--beige);
      cursor: pointer;
    }

    .filter-options {
      top: 5px;
      background-color: var(--navy-dark);
      position: absolute;
      right: 0;
      color: var(--navy-dark);
      display: none;
    }

    .filter-options ul {
      list-style: none;
    }

    .contenedor-img {
      text-align: center;
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--m-spacing);
      row-gap: var(--m-spacing);
      margin-top: var(--xxl-spacing);
      justify-content: center;
    }

    .contenedor-peli img {
      width: 140px;
      height: 210px;
      border-radius: 2px;
      outline: 4px solid transparent;
      outline-offset: -4px;
      transition: outline 0.2s ease, box-shadow 0.2s ease-in;
      box-shadow: 0px 0 20px 5px var(--navy-dark);
      margin: var(--m-spacing);
    }

    .contenedor-peli img:hover {
      outline-color: var(--beige);
      box-shadow: 0px 0 20px 5px var(--beige);
      cursor: pointer;
    }

    #rating-dialog {
      margin: auto auto;
    }

    @media(min-width: 350px) {
      .contenedor-img {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(min-width: 550px) {
      .form-radio {
        flex-direction: row;
        gap: 0;
      }

      .form-radio label {
        border-radius: 0;
      }

      .form-radio label:first-of-type {
        border-top-left-radius: 10px;
        border-bottom-left-radius: 10px;
      }

      .form-radio label:last-of-type {
        border-top-right-radius: 10px;
        border-bottom-right-radius: 10px;
      }

      .contenedor-img {
        grid-template-columns: repeat(3, 1fr);
      }

      .container-filter-section {
        display: flex;
        flex-direction: row;
      }

      .filter-options {
        translate: 70% 0;
      }
    }

    @media(min-width: 730px) {
      .contenedor-img {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media(min-width: 870px) {
      .contenedor-img {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    /* .img1 {
      border-radius: 50%;
    }

    .img2 {
      border-radius: 50%;
    } */
  </style>
</head>
