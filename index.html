<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unacboxd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --navy-dark: #111844;
      --navy-light: #4B5694;
      --navy-lighter: #7288AE;
      --beige: #EAE0CF;
      --purple: #1B2CC1;
      --orange: #DF301C;
      --xs-spacing: 4px;
      --s-spacing: 8px;
      --m-spacing: 16px;
      --l-spacing: 20px;
      --xl-spacing: 24px;
      --xxl-spacing: 40px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 62.5%;
      font-family: "Arimo", sans-serif;
      color: var(--beige)
    }

    body {
      background-color: var(--navy-light);
    }

    .contenedor-img {
      text-align: center;
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: var(--xxl-spacing);
      justify-content: center;
    }

    p {
      font-size: 1.6rem;
      text-align: center;
      font-weight: 900;
      margin-top: var(--m-spacing);
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      background-color: var(--navy-dark);
      /* box-shadow: 4px 0px 30px 8px var(--navy-dark); */
    }

    /* Podemos especificar a las imagenes dentro del nav de esta manera, no hay necesidad de usar class para cada una*/
    nav img {
      width: 45px;
      border-radius: 50%;
    }

    /* Se refiere a todas las imagenes DENTRO del contenedor que tiene la clase "contenedor-peli" */
    .contenedor-peli img {
      width: 140px;
      height: 210px;
      border-radius: 2px;
      outline: 4px solid transparent;
      outline-offset: -4px;
      transition: outline 0.2s ease;
      box-shadow: 0px 0 10px 1px var(--navy-dark);
    }

    .contenedor-peli img:hover {
      outline-color: var(--orange);
      cursor: pointer;
    }

    .form-busqueda {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-radio {
      display: flex;
      justify-content: center;
      /* gap: var(--l-spacing); */
      margin-bottom: var(--m-spacing);
      margin-top: var(--m-spacing);
      /* margin: var(--m-spacing) 0; */
    }

    .form-radio input[type="radio"] {
      appearance: none;
    }

    .form-radio label {
      font-size: 1.2rem;
      font-weight: 900;
      background-color: var(--navy-dark);
      padding: var(--s-spacing);
      transition: background-color 0.2s ease-in;
      /* border-radius: 15px; */

    }

    .form-radio label:first-of-type {
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
    }

    .form-radio label:last-of-type {
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
    }

    /* Pseudoclase -> El estado del elemento */
    .form-radio label:hover {
      background-color: var(--navy-lighter);
      cursor: pointer;
      color: var(--navy-dark);
    }

    input[type="radio"]:checked+label {
      background-color: var(--navy-lighter);
      cursor: pointer;
      color: var(--navy-dark);
    }

    input[type="text"] {
      padding: var(--s-spacing);
      border-radius: var(--s-spacing);
      border: none;
      width: 300px;
      outline: none;
      font-family: inherit;
      font-size: 1.2rem;
      transition: box-shadow 0.2s ease;
    }

    input[type="text"]:focus {
      box-shadow: 0px 0px 15px 2px var(--navy-dark);
    }

    /* .img1 {
      border-radius: 50%;
    }

    .img2 {
      border-radius: 50%;
    } */
  </style>
</head>

<body>
  <nav>
    <!-- Coloca dos imagenes, el logo y la de usuario -->
    <img class="img1" src="./assets/images/logo_sin_texto.png" alt="Logo">
    <img class="img2" src="./assets/images/usuario.webp" alt="Usuario">
  </nav>
  <p>Buscar por: </p>
