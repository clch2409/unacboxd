<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unacboxd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite,star,close" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav>
    <img class="img1" src="./assets/images/logo_sin_texto.png" alt="Logo">
    <img class="img2" src="./assets/images/usuario.webp" alt="Usuario">
  </nav>
  <p>Buscar por: </p>
  <form class="form-busqueda">
    <div class="form-radio">
      <div class="radios">
        <input type="radio" id="peli" name="busqueda" value="pelicula">
        <label for="peli">Pelicula</label>

        <input type="radio" id="direc" name="busqueda" value="director">
        <label for="direc">Director</label>

        <input type="radio" id="actor" name="busqueda" value="actor">
        <label for="actor">Actor/Actriz</label>

        <input type="radio" id="gen" name="busqueda" value="genero">
        <label for="gen">Genero</label>
      </div>
      <span class="material-symbols-outlined quit-find-icon">close</span>
    </div>

    <div class="container-filter-section">
      <input type="text" name="busqueda" placeholder="Ingrese un texto para buscar" id="find-movie">

      <div class="form-container-filter">
        <img class="filter-icon" src="./assets/icons/filter-icon.svg" alt="Icono de Filtrado">
        <div class="filter-options">
          <ul class="list-options">
            <li id="fav">Favoritos</li>
            <li id="cal">Calificadas</li>
            <li id="topMejor">Mejores Calificadas</li>
            <li id="topPeor">Peores Calificadas</li>
          </ul>
        </div>
      </div>

      <span class="material-symbols-outlined non-filter-icon">close</span>
    </div>
  </form>

  <div class="contenedor-img">
    <div class="contenedor-peli">
      <img src="./assets/posters/birdemic.jpg" alt="Imagen 1">
      <span class="material-symbols-outlined non-favorite heart">favorite</span>
      <span class="material-symbols-outlined non-favorite star">star</span>
    </div>
  </div>

  <dialog id="rating-dialog">
    <h2>Califique su Película</h2>
    <form class="rating-stars">
      <div class="stars">
        <input type="radio" id="star-1" name="rating" value="5">
        <label for="star-1">★</label>
        <input type="radio" id="star-2" name="rating" value="4">
        <label for="star-2">★</label>
        <input type="radio" id="star-3" name="rating" value="3">
        <label for="star-3">★</label>
        <input type="radio" id="star-4" name="rating" value="2">
        <label for="star-4">★</label>
        <input type="radio" id="star-5" name="rating" value="1">
        <label for="star-5">★</label>
      </div>
      <div class="rating-buttons">
        <button type="button" id="rating-close">Canelar</button>
        <button type="button" id="rating-send">Enviar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>

</html>
